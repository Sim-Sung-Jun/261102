<style>
  :root{
    --paper:#FBFBF9;
    --card:#FFFFFF;
    --ink:#16181A;
    --muted:#6B7076;
    --faint:#9AA0A6;
    --rule:#E4E6E2;
    --grid:#EEF0EC;
    --up:#0F7B4F;
    --down:#C0392B;
    --toss:#3182F6;
    --coupang:#C8202A;
    --m-rev:#2F6FED;
    --m-profit:#128A5C;
    --m-ad:#D8622C;
    --m-roas:#7B5BD6;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:"Pretendard Variable",Pretendard,-apple-system,system-ui,sans-serif;
    font-size:15px;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
    font-variant-numeric:tabular-nums;
  }
  .wrap{max-width:1000px;margin:0 auto;padding:40px 24px 64px}

  header{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap;margin-bottom:4px}
  h1{font-size:20px;font-weight:600;letter-spacing:-.02em;margin:0}
  .period{font-size:13px;color:var(--faint);margin:2px 0 0}

  .basis{display:inline-flex;border:1px solid var(--rule);border-radius:7px;overflow:hidden;background:var(--card)}
  .basis button{
    appearance:none;border:0;background:transparent;cursor:pointer;
    font:inherit;font-size:13px;color:var(--muted);
    padding:7px 14px;transition:background .12s,color .12s;
  }
  .basis button+button{border-left:1px solid var(--rule)}
  .basis button[aria-pressed="true"]{background:var(--ink);color:#fff}

  nav.tabs{display:flex;gap:28px;border-bottom:1px solid var(--rule);margin:26px 0 28px}
  nav.tabs button{
    appearance:none;background:transparent;border:0;cursor:pointer;font:inherit;
    font-size:16px;font-weight:500;color:var(--faint);
    padding:0 0 12px;margin-bottom:-1px;
    border-bottom:2px solid transparent;transition:color .12s;
  }
  nav.tabs button[aria-selected="true"]{color:var(--ink)}
  nav.tabs button[data-ch="toss"][aria-selected="true"]{border-bottom-color:var(--toss)}
  nav.tabs button[data-ch="coupang"][aria-selected="true"]{border-bottom-color:var(--coupang)}
  nav.tabs .count{font-size:12px;color:var(--faint);font-weight:400;margin-left:6px}

  .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
  @media (max-width:720px){.grid{grid-template-columns:1fr}.wrap{padding:28px 16px 48px}}

  .panel{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:20px 22px 14px}
  .panel .name{font-size:13px;color:var(--muted);margin:0}
  .figure{display:flex;align-items:baseline;gap:10px;margin:6px 0 16px}
  .figure .val{font-size:27px;font-weight:600;letter-spacing:-.025em;line-height:1.1}
  .figure .delta{font-size:13px;font-weight:500}
  .delta.up{color:var(--up)}
  .delta.down{color:var(--down)}
  .delta.flat{color:var(--faint)}
  .plot{position:relative;height:168px}

  .empty{
    border:1px dashed var(--rule);border-radius:12px;background:var(--card);
    padding:44px 28px;text-align:center;
  }
  .empty p{margin:0 0 18px;color:var(--muted);font-size:14px}
  textarea{
    width:100%;min-height:150px;resize:vertical;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;line-height:1.5;
    color:var(--ink);background:var(--paper);
    border:1px solid var(--rule);border-radius:8px;padding:12px 14px;
  }
  textarea:focus{outline:2px solid var(--ink);outline-offset:-1px}
  .btn{
    appearance:none;border:1px solid var(--ink);background:var(--ink);color:#fff;
    font:inherit;font-size:14px;font-weight:500;padding:9px 20px;border-radius:7px;cursor:pointer;
    margin-top:12px;
  }
  .btn:hover{opacity:.86}
  .msg{font-size:13px;color:var(--down);margin:10px 0 0;min-height:1.2em}

  details{margin-top:26px}
  summary{font-size:13px;color:var(--faint);cursor:pointer;list-style:none;padding:6px 0}
  summary::-webkit-details-marker{display:none}
  summary:hover{color:var(--muted)}
  details[open] summary{color:var(--muted)}
  details .box{border:1px solid var(--rule);border-radius:10px;background:var(--card);padding:18px 20px;margin-top:8px}
  .hint{font-size:12.5px;color:var(--faint);margin:10px 0 0;line-height:1.7}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  :focus-visible{outline:2px solid var(--ink);outline-offset:2px}
</style>
</head>

function splitRow(line){
  const out=[]; let cur='', q=false;
  for(let i=0;i<line.length;i++){
    const c=line[i];
    if(c==='"'){ if(q && line[i+1]==='"'){cur+='"';i++;} else q=!q; }
    else if(c===',' && !q){ out.push(cur); cur=''; }
    else cur+=c;
  }
  out.push(cur);
  return out.map(s=>s.trim());
}

function num(s){
  if(s===undefined||s===null) return 0;
  const v=parseFloat(String(s).replace(/[",\s원%]/g,''));
  return isFinite(v)?v:0;
}

function findCols(header){

  const ad=idx(x=>/광고비|광고금액|광고집행/.test(x));
  let profit=idx(x=>/최종순이익|최종이익/.test(x));
  if(profit<0) profit=idx(x=>/순이익|순익/.test(x) && !/광고전/.test(x));
  if(profit<0) profit=idx(x=>/순이익|순익|마진/.test(x));
  return {date, rev, ad, profit};
}

function parse(csv){
  const lines=csv.replace(/\r/g,'').split('\n');
  let hi=0;
  while(hi<lines.length && !lines[hi].trim().replace(/,/g,'')) hi++;
  const head=splitRow(lines[hi]);
  const cols=findCols(head);
  if(cols.rev<0||cols.ad<0||cols.profit<0) throw new Error('매출 · 광고비 · 순이익 열을 찾지 못했습니다. 헤더를 포함해 붙여넣어 주세요.');

  const weeks=[]; let cur=null;
  for(let i=hi+1;i<lines.length;i++){
    const raw=lines[i];
    if(!raw.trim().replace(/[,\s]/g,'')){ cur=null; continue; }
    const c=splitRow(raw);
    const label=(c[cols.date]||'').trim();
    if(!label) { cur=null; continue; }
    if(!cur){ cur={days:[],revenue:0,ad:0,profit:0}; weeks.push(cur); }
    cur.days.push(label);
    cur.revenue+=num(c[cols.rev]);
    cur.ad+=num(c[cols.ad]);
    cur.profit+=num(c[cols.profit]);
  }
  if(!weeks.length) throw new Error('데이터 행을 찾지 못했습니다.');
  weeks.forEach((w,i)=>{
    w.n=w.days.length;
    w.from=w.days[0];
    w.to=w.days[w.days.length-1];
    w.index=i+1;
    w.roas=w.ad>0 ? (w.revenue/w.ad*100) : null;
  });
  weeks.profitLabel=(head[cols.profit]||'순이익').trim();
  return weeks;
}

const state={
  basis:'avg',
  channel:'coupang',
  data:{ coupang:parse(COUPANG_CSV), toss:parse(TOSS_CSV) },
  charts:[]
};

function value(w,key){
  if(key==='roas') return w.roas;
  const raw=w[key==='revenue'?'revenue':key==='profit'?'profit':'ad'];
  return state.basis==='avg' ? raw/w.n : raw;
}

const fmtWon=v=>{
  if(v===null) return '—';
  const a=Math.abs(v);
  if(a>=100000000) return (v/100000000).toFixed(2)+'억';
  if(a>=10000) return (v/10000).toFixed(a>=1000000?0:1)+'만';
  return Math.round(v).toLocaleString();
};
const fmtVal=(v,kind)=> v===null ? '—' : (kind==='pct' ? Math.round(v)+'%' : fmtWon(v)+'원');
const fmtExact=(v,kind)=> v===null ? '—' : (kind==='pct' ? Math.round(v)+'%' : Math.round(v).toLocaleString()+'원');
const fmtAxis=(v,kind)=> kind==='pct' ? Math.round(v)+'%' : fmtWon(v);

function deltaHTML(cur,prev,kind){
  if(cur===null||prev===null||prev===0) return '<span class="delta flat">—</span>';
  if(kind==='pct'){
    const d=Math.round(cur-prev);
    const cls=d>0?'up':d<0?'down':'flat';
    return '<span class="delta '+cls+'">전주 '+(d>0?'+':'')+d+'%p</span>';
  }
  const pct=(cur-prev)/Math.abs(prev)*100;
  const cls=pct>0?'up':pct<0?'down':'flat';
  const shown=Math.abs(pct)>=1000 ? (pct>0?'+':'')+Math.round(pct/100)/10+'배' : (pct>0?'+':'')+pct.toFixed(1)+'%';
  return '<span class="delta '+cls+'">전주 '+shown+'</span>';
}

function hexa(hex,a){
  const n=parseInt(hex.slice(1),16);
  return 'rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+','+a+')';
}

function render(){
  state.charts.forEach(c=>c.destroy());
  state.charts=[];

  const weeks=state.data[state.channel];
  const board=document.getElementById('board');
  document.getElementById('cnt-toss').textContent=state.data.toss?'· '+state.data.toss.length+'주':'';
  document.getElementById('cnt-coupang').textContent=state.data.coupang?'· '+state.data.coupang.length+'주':'';

  if(!weeks){
    document.getElementById('period').textContent='';
    board.innerHTML='<div class="empty"><p>'+(state.channel==='coupang'?'쿠팡':'토스')+' 데이터가 아직 없습니다. 아래 붙여넣기 영역에 시트를 그대로 넣으면 그래프가 그려집니다.</p></div>';
    return;
  }

  const first=weeks[0], last=weeks[weeks.length-1];
  const anyPartial=weeks.some(w=>w.n<7);
  document.getElementById('period').textContent=
    first.from+' – '+last.to+' · '+weeks.length+'개 주차 '+weeks.reduce((s,w)=>s+w.n,0)+'일 · '+
    '큰 숫자는 기간 전체 '+(state.basis==='avg'?'일평균':'합계')+
    (anyPartial?' · * 표시는 7일 미만 주차':'');

  const labels=weeks.map(w=>w.index+'주'+(w.n<7?'*':''));
  const partial=weeks.map(w=>w.n<7);
  const sub=weeks.map(w=>w.from+'~'+w.to.slice(-2)+(w.n<7?' ('+w.n+'일)':''));

  const totalDays=weeks.reduce((s,w)=>s+w.n,0);
  const totals={
    revenue:weeks.reduce((s,w)=>s+w.revenue,0),
    profit:weeks.reduce((s,w)=>s+w.profit,0),
    ad:weeks.reduce((s,w)=>s+w.ad,0)
  };
  totals.roas = totals.ad>0 ? totals.revenue/totals.ad*100 : null;
  const overall=(key)=>{
    if(key==='roas') return totals.roas;
    const raw=totals[key];
    return state.basis==='avg' ? raw/totalDays : raw;
  };

  board.innerHTML='<div class="grid">'+METRICS.map((m,i)=>{
    const nm=(m.key==='profit' && weeks.profitLabel) ? weeks.profitLabel : m.name;
    const series=weeks.map(w=>value(w,m.key));
    const cur=series[series.length-1];
    const head=overall(m.key);
    return '<div class="panel">'+
      '<p class="name">'+nm+' · '+(m.kind==='pct'?'기간 전체':(state.basis==='avg'?'일평균':'기간 합계'))+'</p>'+
      '<div class="figure"><span class="val" style="color:'+m.color+'">'+fmtExact(head,m.kind)+'</span>'+
      '<span class="delta flat">최근 '+last.index+'주 '+fmtExact(cur,m.kind)+'</span></div>'+
      '<div class="plot"><canvas id="c'+i+'" role="img" aria-label="'+nm+' 주차별 추이"></canvas></div>'+
    '</div>';
  }).join('')+'</div>';

  METRICS.forEach((m,i)=>{
    const series=weeks.map(w=>value(w,m.key));
    void weeks.profitLabel;
    state.charts.push(new Chart(document.getElementById('c'+i),{
      type:'line',
      data:{labels:labels,datasets:[{
        data:series,
        borderColor:m.color,
        backgroundColor:hexa(m.color,0.09),
        borderWidth:2,tension:.3,fill:true,spanGaps:true,
        segment:{borderDash:ctx=>partial[ctx.p1DataIndex]?[5,4]:undefined},
        pointRadius:5,
        pointBackgroundColor:weeks.map(w=>w.n<7?'#FFFFFF':m.color),
        pointBorderColor:weeks.map(w=>w.n<7?m.color:'#fff'),
        pointBorderWidth:2,pointHoverRadius:7
      }]},
      options:{
        responsive:true,maintainAspectRatio:false,
        animation:{duration:280},
        plugins:{
          legend:{display:false},
          tooltip:{
            backgroundColor:'#16181A',padding:10,cornerRadius:6,displayColors:false,
            titleFont:{family:'Pretendard',size:12,weight:'500'},
            bodyFont:{family:'Pretendard',size:13},
            callbacks:{
              title:(items)=>sub[items[0].dataIndex],
              label:(c)=>fmtVal(c.parsed.y,m.kind)
            }
          }
        },
        scales:{
          x:{ticks:{color:'#9AA0A6',font:{family:'Pretendard',size:11},autoSkip:false,maxRotation:0},grid:{display:false},border:{color:'#E4E6E2'}},
          y:{ticks:{color:'#9AA0A6',font:{family:'Pretendard',size:11},maxTicksLimit:5,callback:v=>fmtAxis(v,m.kind)},grid:{color:'#EEF0EC'},border:{display:false}}
        }
      }
    }));
  });
}

document.querySelectorAll('nav.tabs button').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('nav.tabs button').forEach(b=>b.setAttribute('aria-selected', b===btn?'true':'false'));
    state.channel=btn.dataset.ch;
    document.getElementById('msg').textContent='';
    render();
  });
});

document.getElementById('b-avg').addEventListener('click',()=>setBasis('avg'));
document.getElementById('b-sum').addEventListener('click',()=>setBasis('sum'));
function setBasis(b){
  state.basis=b;
  document.getElementById('b-avg').setAttribute('aria-pressed',String(b==='avg'));
  document.getElementById('b-sum').setAttribute('aria-pressed',String(b==='sum'));
  render();
}

document.getElementById('apply').addEventListener('click',()=>{
  const msg=document.getElementById('msg');
  const text=document.getElementById('paste').value;
  if(!text.trim()){ msg.textContent='붙여넣은 내용이 없습니다.'; return; }
  try{
    state.data[state.channel]=parse(text);
    msg.textContent='';
    render();
  }catch(e){
    msg.textContent=e.message;
  }
});

render();
</script>
</body>
</html>
